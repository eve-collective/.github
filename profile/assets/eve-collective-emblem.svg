<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Cyan Conduit Gradient -->
    <linearGradient id="embCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="embGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Metallic Hull Gradient -->
    <linearGradient id="embMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="embGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="14" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(256, 256)">
    <!-- Outer Tactical Caliper Rings -->
    <circle r="224" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.35"/>
    <circle r="212" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.5"/>
    <circle r="188" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 12" opacity="0.6"/>
    <circle r="148" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="64 16 16 16" opacity="0.4"/>

    <!-- Compass Ticks -->
    <line x1="0" y1="-224" x2="0" y2="-204" stroke="#00f0ff" stroke-width="2"/>
    <line x1="0" y1="224" x2="0" y2="204" stroke="#00f0ff" stroke-width="2"/>
    <line x1="-224" y1="0" x2="-204" y2="0" stroke="#00f0ff" stroke-width="2"/>
    <line x1="224" y1="0" x2="204" y2="0" stroke="#00f0ff" stroke-width="2"/>

    <!-- Stargate Pylons -->
    <polygon points="-160,-120 -190,-150 -150,-190 -120,-160 -138,-142" fill="url(#embMetal)" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="160,-120 190,-150 150,-190 120,-160 138,-142" fill="url(#embMetal)" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="-160,120 -190,150 -150,190 -120,160 -138,142" fill="url(#embMetal)" stroke="#38bdf8" stroke-width="1.5"/>
    <polygon points="160,120 190,150 150,190 120,160 138,142" fill="url(#embMetal)" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Orbital Trajectory Vector Rings -->
    <ellipse rx="176" ry="68" transform="rotate(-28)" fill="none" stroke="url(#embCyan)" stroke-width="2.5" opacity="0.9" filter="url(#embGlow)"/>
    <ellipse rx="176" ry="68" transform="rotate(28)" fill="none" stroke="url(#embGold)" stroke-width="1.8" opacity="0.8"/>
    
    <!-- Sensor Beacons -->
    <circle cx="-136" cy="-72" r="4.5" fill="#00f0ff" filter="url(#embGlow)"/>
    <circle cx="136" cy="72" r="4.5" fill="#00f0ff" filter="url(#embGlow)"/>
    <circle cx="136" cy="-72" r="3.5" fill="#fbbf24"/>
    <circle cx="-136" cy="72" r="3.5" fill="#fbbf24"/>

    <!-- Central Constellation / Network Graph (The Collective) -->
    <g filter="url(#embGlow)">
      <!-- Hexagonal Perimeter -->
      <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="#00f0ff" stroke-width="3"/>
      
      <!-- Internal Conduit Grid -->
      <line x1="0" y1="-100" x2="0" y2="100" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>
      <line x1="-86.6" y1="-50" x2="86.6" y2="50" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>
      <line x1="-86.6" y1="50" x2="86.6" y2="-50" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>

      <!-- Inner Singularity Aperture -->
      <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#081526" stroke="url(#embGold)" stroke-width="2.5"/>
      <polygon points="0,-28 24,0 0,28 -24,0" fill="url(#embCyan)" stroke="#ffffff" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>

      <!-- Primary System Nodes -->
      <circle cx="0" cy="-100" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
      <circle cx="86.6" cy="-50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
      <circle cx="86.6" cy="50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
      <circle cx="0" cy="100" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-86.6" cy="50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
      <circle cx="-86.6" cy="-50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>

      <!-- Secondary Inner Gate Nodes -->
      <circle cx="0" cy="-52" r="3.5" fill="#fbbf24"/>
      <circle cx="45" cy="-26" r="3.5" fill="#fbbf24"/>
      <circle cx="45" cy="26" r="3.5" fill="#fbbf24"/>
      <circle cx="0" cy="52" r="3.5" fill="#fbbf24"/>
      <circle cx="-45" cy="26" r="3.5" fill="#fbbf24"/>
      <circle cx="-45" cy="-26" r="3.5" fill="#fbbf24"/>
    </g>
  </g>
</svg>
