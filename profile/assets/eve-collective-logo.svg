<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Space Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="65%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#020307"/>
    </radialGradient>

    <!-- Cyan Conduit Gradient -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Metallic Hull Gradient -->
    <linearGradient id="hullMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Badge Background -->
  <rect width="512" height="512" rx="64" fill="url(#spaceBg)"/>

  <!-- Tactical HUD Background Circles & Brackets -->
  <g opacity="0.35" transform="translate(256, 256)">
    <!-- Outer Navigation Caliper -->
    <circle r="224" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.4"/>
    <circle r="212" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.6"/>
    <circle r="188" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="2 12"/>
    <circle r="148" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="64 16 16 16" opacity="0.5"/>

    <!-- Compass Cardinal Ticks -->
    <line x1="0" y1="-224" x2="0" y2="-204" stroke="#00f0ff" stroke-width="2"/>
    <line x1="0" y1="224" x2="0" y2="204" stroke="#00f0ff" stroke-width="2"/>
    <line x1="-224" y1="0" x2="-204" y2="0" stroke="#00f0ff" stroke-width="2"/>
    <line x1="224" y1="0" x2="204" y2="0" stroke="#00f0ff" stroke-width="2"/>

    <!-- 45-degree Sub-ticks -->
    <line x1="-154" y1="-154" x2="-142" y2="-142" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="154" y1="-154" x2="142" y2="-142" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="-154" y1="154" x2="-142" y2="142" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="154" y1="154" x2="142" y2="142" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Stargate Aperture Pylons & Outer Frame (EVE Gate Architectural Aesthetic) -->
  <g transform="translate(256, 256)">
    <!-- Diagonal Stargate Stabilizer Brackets -->
    <!-- Top-Left Pylon -->
    <polygon points="-160,-120 -190,-150 -150,-190 -120,-160 -138,-142" fill="url(#hullMetal)" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <!-- Top-Right Pylon -->
    <polygon points="160,-120 190,-150 150,-190 120,-160 138,-142" fill="url(#hullMetal)" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <!-- Bottom-Left Pylon -->
    <polygon points="-160,120 -190,150 -150,190 -120,160 -138,142" fill="url(#hullMetal)" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <!-- Bottom-Right Pylon -->
    <polygon points="160,120 190,150 150,190 120,160 138,142" fill="url(#hullMetal)" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>

    <!-- Orbital Trajectory Ellipses (Warp Vector Rails) -->
    <ellipse rx="176" ry="68" transform="rotate(-28)" fill="none" stroke="url(#cyanCore)" stroke-width="2.5" opacity="0.85" filter="url(#subtleGlow)"/>
    <ellipse rx="176" ry="68" transform="rotate(28)" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" opacity="0.75"/>
    
    <!-- Stargate Accents: Floating Sensor Nodes on Orbit Rings -->
    <circle cx="-136" cy="-72" r="4.5" fill="#00f0ff" filter="url(#neonGlow)"/>
    <circle cx="136" cy="72" r="4.5" fill="#00f0ff" filter="url(#neonGlow)"/>
    <circle cx="136" cy="-72" r="3.5" fill="#fbbf24"/>
    <circle cx="-136" cy="72" r="3.5" fill="#fbbf24"/>
  </g>

  <!-- Central Nexus: Interconnected Hexagonal Constellation Graph (Collective) -->
  <g transform="translate(256, 256)" filter="url(#neonGlow)">
    <!-- Data / Conduit Graph Vectors -->
    <!-- Outer Hexagon Nodes: (0, -100), (86.6, -50), (86.6, 50), (0, 100), (-86.6, 50), (-86.6, -50) -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.9"/>
    
    <!-- Internal Isometric Stargate / Constellation Links -->
    <line x1="0" y1="-100" x2="0" y2="100" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>
    <line x1="-86.6" y1="-50" x2="86.6" y2="50" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>
    <line x1="-86.6" y1="50" x2="86.6" y2="-50" stroke="#38bdf8" stroke-width="2" opacity="0.75"/>

    <!-- Inner Concentric Hexagon / Jump Gate Singularity Shield -->
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" fill="#081526" stroke="url(#goldAccent)" stroke-width="2.5" opacity="0.95"/>
    
    <!-- Core Stargate Singularity Diamond -->
    <polygon points="0,-28 24,0 0,28 -24,0" fill="url(#cyanCore)" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#neonGlow)"/>

    <!-- Outer Network Nodes (Solar System / Repository Beacons) -->
    <circle cx="0" cy="-100" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="86.6" cy="-50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="86.6" cy="50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="0" cy="100" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-86.6" cy="50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-86.6" cy="-50" r="6" fill="#00f0ff" stroke="#ffffff" stroke-width="2"/>

    <!-- Inner Nodes -->
    <circle cx="0" cy="-52" r="3.5" fill="#fbbf24"/>
    <circle cx="45" cy="-26" r="3.5" fill="#fbbf24"/>
    <circle cx="45" cy="26" r="3.5" fill="#fbbf24"/>
    <circle cx="0" cy="52" r="3.5" fill="#fbbf24"/>
    <circle cx="-45" cy="26" r="3.5" fill="#fbbf24"/>
    <circle cx="-45" cy="-26" r="3.5" fill="#fbbf24"/>
  </g>

  <!-- Tactical HUD Details (EVE UI Bracket Aesthetics) -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.75">
    <!-- Top-Left Corner Bracket -->
    <path d="M 40 70 L 40 40 L 70 40"/>
    <!-- Top-Right Corner Bracket -->
    <path d="M 472 70 L 472 40 L 442 40"/>
    <!-- Bottom-Left Corner Bracket -->
    <path d="M 40 442 L 40 472 L 70 472"/>
    <!-- Bottom-Right Corner Bracket -->
    <path d="M 472 442 L 472 472 L 442 472"/>
  </g>

  <!-- Technical Labeling (EVE Style HUD Typography) -->
  <g fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2">
    <text x="52" y="58">EVE // COLLECTIVE</text>
    <text x="460" y="58" text-anchor="end">SYS.NET // 01</text>
    <text x="52" y="464">NEW EDEN // OPEN SOURCE</text>
    <text x="460" y="464" text-anchor="end">SEC // 1.0</text>
  </g>
</svg>
